<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FIVER DOWNHILL — 2026 Season</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --red:#C8261A;--red-dark:#9e1e12;--red-glow:rgba(200,38,26,.10);
  --gold:#C89010;--silver:#6a8078;--bronze:#9c6020;
  --dns-text:#b04040;--dns-bg:#fff0f0;
  --bg:#f4f2f0;--surface:#fff;--surface-2:#f0eeec;
  --border:#e0dbd6;--header-bg:#111;--header-dim:#70685e;
  --text:#1a1714;--text-2:#6a6460;--text-3:#a09890;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --red:#e03020;--dns-text:#e07070;--dns-bg:#2c1616;
  --bg:#141210;--surface:#1e1c1a;--surface-2:#262320;
  --border:#302c28;--header-dim:#706858;
  --text:#ece8e4;--text-2:#8a8078;--text-3:#504840;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;line-height:1.4}
button{cursor:pointer;font-family:inherit;border:none;background:none}

/* HEADER */
.hdr{background:var(--header-bg);padding:11px 20px;display:flex;align-items:center;gap:16px}
.hdr-logo{height:36px;width:auto;flex-shrink:0;display:block;background:#fff;border-radius:4px;padding:4px 10px;box-sizing:content-box}
.hdr-divider{width:1px;height:32px;background:rgba(255,255,255,.12);flex-shrink:0}
.hdr-name{font-family:'Anton',sans-serif;font-size:26px;color:#fff;letter-spacing:.03em;line-height:1}
.hdr-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;color:var(--header-dim);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.hdr-prog{display:flex;gap:5px;align-items:center;margin-left:auto}
.pip{width:28px;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.pip.done{background:var(--red)}.pip.cur{background:rgba(255,255,255,.45)}

/* SPONSORS BAND */
.spon-band{background:var(--surface);border-bottom:2px solid var(--border);padding:12px 0}
.spon-inner{max-width:1100px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.spon-ttl{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3);white-space:nowrap;flex-shrink:0}
.spon-rule{width:1px;height:22px;background:var(--border);flex-shrink:0}
.spon-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spon-card{display:flex;align-items:center;text-decoration:none;padding:8px 16px;border:1.5px solid var(--border);border-left:3px solid var(--red);border-radius:3px;background:var(--surface-2);transition:background .13s,border-color .13s,box-shadow .13s;gap:8px}
.spon-card:hover{background:var(--red-glow);border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.spon-card svg{flex-shrink:0;opacity:.45;transition:opacity .13s}
.spon-card:hover svg{opacity:.7}
.spon-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text);line-height:1;white-space:nowrap}
.spon-logo{height:32px;width:auto;display:block;opacity:.8;transition:opacity .13s}
.spon-card:hover .spon-logo{opacity:1}

/* SHELL / TABS */
.shell{max-width:1100px;margin:0 auto;padding:0 16px 56px}
.tabs{display:flex;border-bottom:2px solid var(--border)}
.tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;padding:13px 20px 11px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);transition:color .14s,border-color .14s}
.tab:hover{color:var(--text)}.tab.on{color:var(--red);border-bottom-color:var(--red)}

/* CHIPS */
.chips{display:flex;gap:6px;padding:12px 0;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--surface);border:1.5px solid var(--border);border-radius:99px;padding:5px 13px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text-2);transition:background .12s,color .12s,border-color .12s}
.chip:hover{border-color:var(--red);color:var(--text)}.chip.on{background:var(--red);border-color:var(--red);color:#fff}

/* VIEWS */
.view{display:none}.view.on{display:block}

/* PODIUM */
.podium{display:grid;grid-template-columns:1fr 1.22fr 1fr;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden}
.pcol{padding:18px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;border-right:1px solid var(--border)}
.pcol:last-child{border-right:none}
.pcol.center{background:var(--red-glow);padding-top:28px;padding-bottom:28px}
.pnum{font-family:'Anton',sans-serif;line-height:1}
.pcol:nth-child(1) .pnum{font-size:40px;color:var(--silver)}
.pcol.center .pnum{font-size:56px;color:var(--gold)}
.pcol:nth-child(3) .pnum{font-size:40px;color:var(--bronze)}
.pname{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;color:var(--text);line-height:1.2}
.pcol.center .pname{font-size:21px}
.ppts{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums}

/* TABLE */
.twrap{overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:4px}
table{width:100%;border-collapse:collapse}
th{background:var(--surface-2);font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2);padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:nth-child(even) td{background:var(--surface-2)}
tr.lead td{background:rgba(200,38,26,.07)!important}
tr.dns td{color:var(--dns-text)!important;background:var(--dns-bg)!important}
tr.sec-hd td{background:var(--surface-2)!important;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-2);padding:5px 12px;border-bottom:1px solid var(--border)}
.th-r,.td-r{text-align:right}
td.pos{font-family:'JetBrains Mono',monospace;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text-2);width:32px;padding-right:4px}
td.rname{font-weight:500}
td.rcat{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--text-2)}
td.rpt{font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right;color:var(--text-3);font-variant-numeric:tabular-nums}
td.rpt.scored{color:var(--text)}
td.tot{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}

td.tim,td.gap{font-family:'JetBrains Mono',monospace;font-size:13px;text-align:right;color:var(--text-2);font-variant-numeric:tabular-nums}

/* RACE TABS */
.rtabs{display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap}
.rtab{background:var(--surface);border:1.5px solid var(--border);border-radius:3px;padding:7px 14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);transition:all .12s}
.rtab:hover:not(.soon){border-color:var(--red);color:var(--text)}.rtab.on{background:var(--red);border-color:var(--red);color:#fff}.rtab.soon{opacity:.4;cursor:default}
.rtab-num{font-size:10px;opacity:.6;margin-left:5px}
.coming{padding:48px 20px;text-align:center}
.coming .cslbl{font-family:'Anton',sans-serif;font-size:18px;color:var(--text-2);letter-spacing:.04em;margin-bottom:8px}
.coming .cssponsor{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}

/* RACE BANNER */
.race-banner{position:relative;height:220px;border-radius:4px;overflow:hidden;margin-bottom:16px;background:var(--header-bg)}
.race-banner img.bphoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.race-banner .scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,rgba(0,0,0,.35) 55%,rgba(0,0,0,.10) 100%)}
.race-banner .binfo{position:absolute;bottom:0;left:0;right:0;padding:18px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.race-banner .bname{font-family:'Anton',sans-serif;font-size:34px;color:#fff;letter-spacing:.03em;line-height:1}
.race-banner .bmeta{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:4px}
.race-banner .bsponsor{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.32);margin-top:3px}
.race-banner .bnum{font-family:'Anton',sans-serif;font-size:80px;color:rgba(255,255,255,.08);line-height:1;flex-shrink:0;user-select:none}
.banner-no-img{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.06}
.today-badge{display:inline-block;background:var(--red);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;margin-left:8px;vertical-align:middle}

@media(max-width:600px){
  .hdr-name{font-size:20px}.shell{padding:0 10px 40px}
  .tab{padding:11px 14px 9px;font-size:13px}
  .hdr-logo{height:26px;padding:3px 8px}
  .race-banner .bname{font-size:26px}
  .spon-inner{gap:12px}
  .spon-name{font-size:13px}
}

.credit-bar{text-align:center;padding:20px 16px 28px;opacity:.45;transition:opacity .2s}
.credit-bar:hover{opacity:.8}
.credit-link{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#888;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.credit-logo{height:18px;width:auto;display:block;filter:brightness(.9)}
</style>
</head>

const pts=p=>S.pts[Math.min(p-1,S.pts.length-1)]||0;
const pt=t=>{const[m,s]=t.split(':');return+m*60+ +s;};
const gap=(lt,t)=>'+' +(pt(t)-pt(lt)).toFixed(1);

function renderPips(){
  const done=S.races.filter(r=>r.status==='complete').length;
  const pips=S.races.map((r,i)=>{
    const cls='pip'+(i<done?' done':i===done?' cur':'');
    return '<div class="'+cls+'" title="'+r.name+'"></div>';
  }).join('');
  document.getElementById('hdr-prog').innerHTML=pips;
}

const MOOSE_SVG='<svg class="banner-no-img" viewBox="0 0 48 56" width="180" height="210" fill="white" aria-hidden="true"><path d="M16 28C13 30 11 35 11 40C11 45 14 51 18.5 53L18.5 54.5C18.5 55 19 55.5 19.5 55.5H21C21.5 55.5 22 55 22 54.5V53C22.5 53 23 53 23.5 53V54.5C23.5 55 24 55.5 24.5 55.5H26C26.5 55.5 27 55 27 54.5V53C31.5 51 35 45 35 40C35 35 33 30 30 28Z"/><path d="M16 30C12 28 9 25 10.5 22C12.5 23 14.5 26 16 30Z"/><path d="M30 30C34 28 37 25 35.5 22C33.5 23 31.5 26 30 30Z"/><ellipse cx="23" cy="51" rx="4" ry="3"/><path d="M16 28L13 19L10 10L8 3L10 3L11 8L12 2L14 2L14 11L16.5 7L18.5 8.5L16 18L17 24Z"/><path d="M30 28L33 19L36 10L38 3L36 3L35 8L34 2L32 2L32 11L29.5 7L27.5 8.5L30 18L29 24Z"/></svg>';

function renderBanner(race){
  const n=S.races.indexOf(race)+1;
  const isToday=race.status==='upcoming'&&race.img;
  const status=race.status==='complete'?'Results':isToday?'Race day!':'Coming Up';
  const todayBadge=isToday?'<span class="today-badge">Today</span>':'';
  const imgEl=race.img?'<img class="bphoto" src="'+race.img+'" alt="'+race.name+'">':MOOSE_SVG;
  const sponsorLine=race.sponsor?'<div class="bsponsor">Sponsored by '+race.sponsor+'</div>':'';
  return '<div class="race-banner">'+imgEl+'<div class="scrim"></div><div class="binfo"><div><div class="bname">'+race.name+'</div><div class="bmeta">DH Fiver #'+n+' &nbsp;&middot;&nbsp; '+race.date+' &nbsp;&middot;&nbsp; '+status+todayBadge+'</div>'+sponsorLine+'</div><div class="bnum">'+n+'</div></div></div>';
}

function catStandings(cid){
  const m={};
  S.races.forEach(race=>{
    const en=S.res[race.id]?.[cid]||[];
    let pl=0;
    en.forEach(e=>{
      if(!e.dns)pl++;
      if(!m[e.n])m[e.n]={n:e.n,r:{},cos:{}};
      m[e.n].r[race.id]=e.dns?null:pts(pl);
      m[e.n].cos[race.id]=!e.dns&&!!e.c;
    });
  });
  return Object.values(m).map(x=>({
    ...x,
    tot:Object.values(x.r).reduce((a,v)=>a+(v||0),0)+Object.values(x.cos).filter(Boolean).length*S.costume,
    anycos:Object.values(x.cos).some(Boolean),
  })).sort((a,b)=>b.tot-a.tot);
}

function allStandings(){
  return S.cats.flatMap(cat=>catStandings(cat.id).map(r=>({...r,catLabel:cat.l})))
    .sort((a,b)=>b.tot-a.tot);
}

function raceResults(rid,cid){
  const en=S.res[rid]?.[cid]||[];
  let pl=0;
  const lt=en.find(e=>!e.dns)?.t;
  return en.map(e=>{
    if(!e.dns)pl++;
    return{...e,pl:e.dns?null:pl,p:e.dns?0:pts(pl),g:e.dns?'DNS':(pl===1?'---':gap(lt,e.t))};
  });
}

const st={tab:'standings',cat:'am',race:'r1'};

function renderChips(){
  const bar=document.getElementById('chips');
  bar.innerHTML='';
  const mk=(id,lbl)=>{
    const b=document.createElement('button');
    b.className='chip'+(st.cat===id?' on':'');
    b.textContent=lbl;
    b.onclick=function(){st.cat=id;render();};
    return b;
  };
  if(st.tab==='standings')bar.appendChild(mk('all','All'));
  S.cats.forEach(c=>bar.appendChild(mk(c.id,c.l)));
}

function renderPodium(){
  const el=document.getElementById('podium');
  if(st.cat==='all'){el.innerHTML='';return;}
  const rows=catStandings(st.cat);
  if(!rows.length){el.innerHTML='';return;}
  const f=rows[0],s=rows[1],t=rows[2];
  const cols=s?[{r:s,p:2},{r:f,p:1},t?{r:t,p:3}:null]:[null,{r:f,p:1},null];
  let h='<div class="podium">';
  cols.forEach((c,i)=>{
    if(c){
      h+='<div class="pcol'+(i===1?' center':'')+'"><div class="pnum">'+c.p+'</div><div class="pname">'+c.r.n+'</div><div class="ppts">'+c.r.tot+' pts</div></div>';
    }else{
      h+='<div class="pcol'+(i===1?' center':'')+'"></div>';
    }
  });
  h+='</div>';
  el.innerHTML=h;
}

function renderStandings(){
  const isAll=st.cat==='all';
  const rows=isAll?allStandings():catStandings(st.cat);
  let h='<thead><tr><th style="width:32px">#</th><th>Racer</th>';
  if(isAll)h+='<th>Category</th>';
  S.races.forEach(r=>h+='<th class="th-r">'+r.name+'</th>');
  h+='<th class="th-r">Total</th></tr></thead><tbody>';
  rows.forEach((row,i)=>{
    h+='<tr class="'+(i===0?'lead':'')+'">';
    h+='<td class="pos">'+(i+1)+'</td><td class="rname">'+row.n+'</td>';
    if(isAll)h+='<td class="rcat">'+row.catLabel+'</td>';
    S.races.forEach(r=>{
      const v=row.r[r.id];
      if(r.status==='upcoming')h+='<td class="rpt">&#x2014;</td>';
      else h+='<td class="rpt'+(v!=null?' scored':'')+'">'+(v!=null?v:'&#x2014;')+'</td>';
    });
    h+='<td class="tot">'+row.tot+'</td></tr>';
  });
  h+='</tbody>';
  document.getElementById('tbl-s').innerHTML=h;
}

function renderRaceTabs(){
  const bar=document.getElementById('rtabs');
  bar.innerHTML='';
  S.races.forEach((r,i)=>{
    const b=document.createElement('button');
    const clickable=r.status==='complete'||r.img;
    b.className='rtab'+(r.status==='upcoming'&&!r.img?' soon':'')+(st.race===r.id?' on':'');
    b.innerHTML=r.name+'<span class="rtab-num">#'+(i+1)+'</span>';
    if(clickable)b.onclick=function(){st.race=r.id;render();};
    bar.appendChild(b);
  });
}

function renderResults(){
  const wrap=document.getElementById('results-wrap');
  const race=S.races.find(r=>r.id===st.race);
  if(race.status==='upcoming'){
    const isToday=race.img;
    const msg=isToday?'Race day! Results post after the event.':'Check back after race day for results';
    const sp=race.sponsor?'<div class="cssponsor">Sponsored by '+race.sponsor+'</div>':'';
    wrap.innerHTML=renderBanner(race)+'<div class="coming"><div class="cslbl">'+msg+'</div>'+sp+'</div>';
    return;
  }
  const showAll=!S.res[st.race]?.[st.cat]?.length||(st.cat==='all');
  const dispCats=showAll
    ?S.cats.filter(c=>S.res[st.race]?.[c.id]?.length)
    :S.cats.filter(c=>c.id===st.cat&&S.res[st.race]?.[c.id]?.length);

  let h=renderBanner(race)+'<div class="twrap"><table><thead><tr><th style="width:32px">Pos</th><th>Racer</th>';
  if(showAll)h+='<th>Category</th>';
  h+='<th class="th-r">Time</th><th class="th-r">Gap</th><th class="th-r">Pts</th></tr></thead><tbody>';
  dispCats.forEach(cat=>{
    const res=raceResults(st.race,cat.id);
    if(!res.length)return;
    if(showAll)h+='<tr class="sec-hd"><td colspan="6">'+cat.l+'</td></tr>';
    res.forEach(e=>{
      h+='<tr class="'+(e.dns?'dns':e.pl===1?'lead':'')+'"><td class="pos">'+(e.dns?'DNS':e.pl)+'</td><td class="rname">'+e.n+'</td>';
      if(showAll)h+='<td class="rcat"></td>';
      h+='<td class="tim">'+(e.dns?'&#x2014;':e.t)+'</td><td class="gap">'+e.g+'</td><td class="rpt'+(e.dns?'':' scored')+'">'+(e.dns?'&#x2014;':e.p)+'</td></tr>';
    });
  });
  h+='</tbody></table></div>';
  wrap.innerHTML=h;
}

function render(){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById('v-'+st.tab).classList.add('on');
  renderChips();
  if(st.tab==='standings'){renderPodium();renderStandings();}
  else{renderRaceTabs();renderResults();}
}

renderPips();
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    st.tab=b.dataset.t;
    if(st.tab==='results'&&st.cat==='all')st.cat='am';
    render();
  });
});

render();
</script>
